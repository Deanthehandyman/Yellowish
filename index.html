<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pocket Frontier: Legends Prototype</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
  #c { position: absolute; inset: 0; display: block; }
  
  #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;}
  .hud { background: rgba(0,0,0,0.5); color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold; pointer-events: auto; }
  
  /* Mobile Joystick */
  #joyBase { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); bottom: 40px; left: 40px; display: none; pointer-events: none;}
  #joyKnob { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.8); top: 35px; left: 35px; }
  
  #hint { align-self: center; background: rgba(255,255,255,0.9); color: #333; padding: 10px 20px; border-radius: 20px; margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui-layer">
    <div class="hud">Legends Prototype - v0.1</div>
    <div id="hint">Left side: Drag to run | Right side: Swipe to look</div>
    <div id="joyBase"><div id="joyKnob"></div></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.rotation.order = 'YXZ';

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffdfb0, 1.2);
sun.position.set(100, 200, 50);
sun.castShadow = true;
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
scene.add(sun);

// Vast Environment
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshToonMaterial({color: 0x4CAF50}));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Procedural Trees
const treeGeo = new THREE.ConeGeometry(2, 6, 5);
const treeMat = new THREE.MeshToonMaterial({color: 0x2E8B57});
const trunkGeo = new THREE.CylinderGeometry(0.5, 0.5, 2);
const trunkMat = new THREE.MeshToonMaterial({color: 0x5D4037});

for(let i=0; i<200; i++){
    const x = (Math.random() - 0.5) * 400;
    const z = (Math.random() - 0.5) * 400;
    if (Math.abs(x) < 10 && Math.abs(z) < 10) continue; // Keep spawn clear
    
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.set(x, 1, z);
    trunk.castShadow = true;
    
    const leaves = new THREE.Mesh(treeGeo, treeMat);
    leaves.position.set(x, 4, z);
    leaves.castShadow = true;
    
    scene.add(trunk, leaves);
}

// Player Model
const playerGroup = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1, 4, 8), new THREE.MeshToonMaterial({color: 0x3498db}));
pBody.position.y = 1; pBody.castShadow = true;
playerGroup.add(pBody);
scene.add(playerGroup);

// Game State & Controls
const G = {
    x: 0, z: 0, yaw: 0, pitch: -0.2, speed: 15,
    moveX: 0, moveY: 0, lookDeltaX: 0, lookDeltaY: 0
};

// Touch Controls
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let moveTouch = null, lookTouch = null, joyOrigin = {x:0, y:0}, lastLook = {x:0, y:0};

window.addEventListener('touchstart', e => {
    for(let i=0; i<e.changedTouches.length; i++){
        const t = e.changedTouches[i];
        if(t.clientX < window.innerWidth / 2 && !moveTouch){
            moveTouch = t.identifier;
            joyOrigin = {x: t.clientX, y: t.clientY};
            joyBase.style.display = 'block';
            joyBase.style.left = (t.clientX - 60) + 'px';
            joyBase.style.top = (t.clientY - 60) + 'px';
            joyKnob.style.transform = `translate(0px, 0px)`;
        } else if(t.clientX >= window.innerWidth / 2 && !lookTouch){
            lookTouch = t.identifier;
            lastLook = {x: t.clientX, y: t.clientY};
        }
    }
});

window.addEventListener('touchmove', e => {
    for(let i=0; i<e.changedTouches.length; i++){
        const t = e.changedTouches[i];
        if(t.identifier === moveTouch){
            let dx = t.clientX - joyOrigin.x;
            let dy = t.clientY - joyOrigin.y;
            const dist = Math.hypot(dx, dy);
            const maxR = 35;
            if(dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            G.moveX = dx / maxR;
            G.moveY = -dy / maxR; // Invert Y for forward
        } else if(t.identifier === lookTouch){
            G.lookDeltaX += (t.clientX - lastLook.x);
            G.lookDeltaY += (t.clientY - lastLook.y);
            lastLook = {x: t.clientX, y: t.clientY};
        }
    }
});

const endTouch = e => {
    for(let i=0; i<e.changedTouches.length; i++){
        const t = e.changedTouches[i];
        if(t.identifier === moveTouch){
            moveTouch = null; G.moveX = 0; G.moveY = 0;
            joyBase.style.display = 'none';
        } else if(t.identifier === lookTouch){
            lookTouch = null;
        }
    }
};
window.addEventListener('touchend', endTouch);
window.addEventListener('touchcancel', endTouch);
window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); });

// Main Loop
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // Camera Rotation
    G.yaw -= G.lookDeltaX * 0.005;
    G.pitch -= G.lookDeltaY * 0.005;
    G.pitch = Math.max(-1.2, Math.min(1.2, G.pitch));
    G.lookDeltaX = 0; G.lookDeltaY = 0;

    // Movement relative to camera
    if(Math.abs(G.moveX) > 0.1 || Math.abs(G.moveY) > 0.1){
        const fwdX = Math.sin(G.yaw); const fwdZ = Math.cos(G.yaw);
        const rightX = Math.sin(G.yaw + Math.PI/2); const rightZ = Math.cos(G.yaw + Math.PI/2);
        
        G.x += (fwdX * G.moveY + rightX * G.moveX) * G.speed * dt;
        G.z += (fwdZ * G.moveY + rightZ * G.moveX) * G.speed * dt;
        
        playerGroup.rotation.y = Math.atan2(fwdX * G.moveY + rightX * G.moveX, fwdZ * G.moveY + rightZ * G.moveX);
    }
    
    playerGroup.position.set(G.x, 0, G.z);

    // Third Person Camera Math
    const camDist = 6;
    const camHeight = 2.5;
    camera.position.x = G.x - Math.sin(G.yaw) * camDist;
    camera.position.z = G.z - Math.cos(G.yaw) * camDist;
    camera.position.y = camHeight - Math.sin(G.pitch) * camDist;
    
    camera.lookAt(G.x, 1.5, G.z);

    renderer.render(scene, camera);
}
animate();
})();
</script>
</body>
</html>
